site_name: ChimeraLM Documentation
site_url: https://ylab-hi.github.io/chimera/
repo_url: https://github.com/ylab-hi/chimera
repo_name: ylab-hi/chimera

# Theme configuration with Material for MkDocs
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  features:
    # Navigation
    - navigation.tabs          # Top-level sections as tabs
    - navigation.tabs.sticky   # Sticky navigation tabs
    - navigation.sections      # Expandable sections
    - navigation.expand        # Expand all sections by default
    - navigation.path          # Show breadcrumb path
    - navigation.indexes       # Allow index pages for sections
    - navigation.instant       # SPA-like instant loading
    - navigation.instant.progress  # Show progress bar for instant loading
    - navigation.tracking      # Update URL on scroll
    - navigation.top           # Back-to-top button
    - navigation.footer        # Footer with prev/next navigation
    - toc.follow               # TOC follows scroll
    - toc.integrate            # Integrate TOC into navigation

    # Search
    - search.highlight         # Highlight search terms
    - search.suggest           # Search suggestions
    - search.share             # Share search results

    # Content
    - content.code.copy        # Copy button on code blocks
    - content.code.select      # Select code blocks
    - content.code.annotate    # Code annotations
    - content.tabs.link        # Linked content tabs
    - content.tooltips         # Improved tooltips
    - content.action.edit      # Edit button on pages
    - content.action.view      # View source button
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/logo.svg

# Custom CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

# Announcement bar for important updates
# Uncomment and customize when needed:
# theme:
#   custom_dir: overrides
# extra:
#   announcement:
#     text: "🎉 New release! ChimeraLM v0.2.0 with improved accuracy"
#     link: https://github.com/ylab-hi/chimera/releases

# Social cards and metadata
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ylab-hi/chimera
      name: ChimeraLM on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/chimeralm/
      name: ChimeraLM on PyPI
  generator: false  # Remove "Made with Material for MkDocs"

  # Analytics (uncomment when ready)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

  # Version selector (for when you have multiple versions)
  # version:
  #   provider: mike

# Navigation structure based on contracts/nav-structure.yaml
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Tutorials:
      - Filtering BAM Files: tutorials/bam-filtering.md
      - Performance Optimization: tutorials/performance-optimization.md
      - Web Interface: tutorials/web-interface.md
      - Pipeline Integration: tutorials/pipeline-integration.md
  - Reference:
      - CLI Commands: reference/cli.md
      - API Reference:
          - Models API: reference/models.md
  - Contributing:
      - Development Setup: contributing/development-setup.md
      - Testing: contributing/testing.md
      - Adding Features: contributing/adding-features.md
      - Code of Conduct: contributing/code_of_conduct.md
  - About:
      - Citation: about/citation.md
      - License: about/license.md

# Plugins configuration
plugins:
  - search:
      separator: '[\s\-\.]+'  # Support genomics terms like "BAM", "WGA"
  # - social:  # Requires mkdocs-material[imaging] - optional enhancement
  #     cards: true
  #     cards_layout_options:
  #       background_color: "#3f51b5"  # Indigo
  #       color: "#ffffff"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

# Markdown extensions
markdown_extensions:
  # Syntax highlighting with advanced features
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: false
      linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Tabbed content
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # Icons and emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Admonitions with collapsible support
  - admonition
  - pymdownx.details

  # Markdown enhancements
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      check_paths: false
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.keys
  - footnotes
  - tables
  - def_list

  # Advanced typography
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols

  # Better formatting
  - pymdownx.betterem:
      smart_enable: all

  # Table of contents
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3

  # Abbreviations
  - abbr
