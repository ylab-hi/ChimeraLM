_target_: chimeralm.data.bam.BamDataModule

tokenizer:
  _target_: chimeralm.data.tokenizer.load_tokenizer_from_hyena_model
  model_name: hyenadna-small-32k-seqlen

train_data_path: null
val_data_path: null
test_data_path: null

# Auto-split ratios when val_data_path and test_data_path are null
# If both are null, train_data_path will be split using these ratios
train_val_test_split: [0.7, 0.2, 0.1]  # [train, val, test]

batch_size: 8 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
num_workers: 0
pin_memory: False